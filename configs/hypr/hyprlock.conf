# Kanso Minimal Hyprlock Configuration
# Tokyo Night theme with clean typography and modern password input

background {
    monitor =
    color = rgba(26, 27, 38, 1.0)
    blur_passes = 2
    blur_size = 5
}

# Current Time
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = rgba(192, 202, 245, 1.0)
    font_size = 80
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, 120
    halign = center
    valign = center
}

# Current Date
label {
    monitor =
    text = cmd[update:60000] echo "$(date +"%A, %B %d")"
    color = rgba(122, 162, 247, 1.0)
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    position = 0, 40
    halign = center
    valign = center
}

# User Greeting
label {
    monitor =
    text = $USER
    color = rgba(169, 177, 214, 0.8)
    font_size = 14
    font_family = JetBrainsMono Nerd Font
    position = 0, -40
    halign = center
    valign = center
}

# Password Input Field
input-field {
    monitor =
    size = 280, 48
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true

    font_family = JetBrainsMono Nerd Font
    fade_on_empty = false
    placeholder_text = <span foreground="##565f89">Enter Password...</span>

    inner_color = rgba(36, 40, 59, 0.8)
    font_color = rgba(192, 202, 245, 1.0)
    check_color = rgba(122, 162, 247, 1.0)
    fail_color = rgba(247, 118, 142, 1.0)
    fail_text = <i>Password Incorrect ($ATTEMPTS)</i>

    border_color = rgba(122, 162, 247, 0.6)

    position = 0, -100
    halign = center
    valign = center
}
