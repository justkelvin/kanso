# Kanso Minimal Kitty Configuration
# Typography
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.0

# Cursor
cursor_shape          beam
cursor_beam_thickness 1.5
cursor_blink_interval 0.5

# Window Layout & Padding
window_padding_width  12
confirm_os_window_close 0
enable_audio_bell     no

# Background & Opacity
background_opacity 0.95
dynamic_background_opacity yes

# Colors (Tokyo Night Minimal)
background #1a1b26
foreground #c0caf5
selection_background #283457
selection_foreground #c0caf5

cursor #c0caf5
cursor_text_color #1a1b26

# Black
color0 #15161e
color8 #414868

# Red
color1 #f7768e
color9 #f7768e

# Green
color2  #9ece6a
color10 #9ece6a

# Yellow
color3  #e0af68
color11 #e0af68

# Blue
color4  #7aa2f7
color12 #7aa2f7

# Magenta
color5  #bb9af7
color13 #bb9af7

# Cyan
color6  #7dcfff
color14 #7dcfff

# White
color7  #a9b1d6
color15 #c0caf5

# Dynamic theme inclusion (managed by kanso theme / wallbash)
include theme.conf
