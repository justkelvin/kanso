# Kanso Minimal Hypridle Configuration
# Power management and auto-locking tailored for laptops

general {
    lock_cmd = pidof hyprlock || hyprlock       # Avoid starting multiple hyprlock instances
    before_sleep_cmd = loginctl lock-session    # Lock screen before suspend
    after_sleep_cmd = hyprctl dispatch dpms on  # Turn display on after resume
}

# 1. Dim backlight after 2.5 minutes of inactivity
listener {
    timeout = 150
    on-timeout = brightnessctl -s set 10
    on-resume = brightnessctl -r
}

# 2. Lock screen after 5 minutes of inactivity
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# 3. Turn off monitor DPMS after 5.5 minutes of inactivity
listener {
    timeout = 330
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

# 4. Suspend system after 10 minutes of inactivity
listener {
    timeout = 600
    on-timeout = systemctl suspend
}
